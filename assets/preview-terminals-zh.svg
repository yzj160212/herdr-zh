<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <style>
      .txt  { font-family:"PingFang SC","Hiragino Sans GB",Helvetica,sans-serif; }
      .mid  { font-size:11.5px; fill:#c4c6ca; }
      .dim  { font-size:11px; fill:#8b8f95; }
      .mono { font-family:"JetBrains Mono",Menlo,monospace; font-size:11px; fill:#a9adb3; }
    </style>
  </defs>
  <rect width="640" height="400" fill="#131619"/><rect x="0.5" y="0.5" width="639" height="399" fill="none" stroke="#25282c"/>
  <!-- 顶部可拖动栏 -->
  <rect x="12" y="12" width="616" height="46" rx="12" fill="#1d1f22"/>
  <rect x="24" y="20" width="150" height="30" rx="15" fill="#252628"/>
  <text x="42" y="40" class="txt mid">工作区</text>
  <rect x="190" y="18" width="210" height="34" rx="17" fill="#34373c" stroke="#4a4d53"/>
  <rect x="198" y="24" width="22" height="22" rx="7" fill="#252628"/>
  <text x="230" y="40" class="txt mid">修 bug</text>
  <rect x="410" y="18" width="150" height="34" rx="17" fill="#00000000"/>
  <text x="430" y="40" class="txt dim">测试</text>
  <!-- 两格终端 -->
  <rect x="12" y="70" width="304" height="318" rx="12" fill="#0f1114" stroke="#25282c"/>
  <text x="28" y="96" class="mono" fill="#8b8f95">&gt;_ zsh</text>
  <text x="28" y="126" class="txt mid" fill="#22a99a">❯ 向右分屏 / 向下分屏</text>
  <rect x="324" y="70" width="304" height="318" rx="12" fill="#0f1114" stroke="#3b82f6"/>
  <text x="340" y="96" class="mono" fill="#8b8f95">&gt;_ 代理</text>
  <text x="340" y="126" class="txt mid" fill="#e3814f">● 需要你</text>
  <text x="340" y="148" class="txt dim">正在处理你的问题…</text>
</svg>
