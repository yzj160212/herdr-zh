<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <style>
      .bg { fill:#131619; } .chrome{ fill:#17191c; } .card{ fill:#0f1114; }
      .edge { fill:none; stroke:#25282c; stroke-width:1; }
      .txt  { font-family:"PingFang SC","Hiragino Sans GB",Helvetica,sans-serif; }
      .head { font-size:13px; fill:#e8e9eb; font-weight:600; }
      .mid  { font-size:11.5px; fill:#c4c6ca; }
      .dim  { font-size:11px; fill:#8b8f95; }
      .key  { font-size:11px; fill:#5d6168; }
      .mono { font-family:"JetBrains Mono",Menlo,monospace; font-size:11px; fill:#a9adb3; }
    </style>
  </defs>
  <rect width="640" height="400" class="bg"/><rect x="0.5" y="0.5" width="639" height="399" fill="none" stroke="#25282c"/>
  <!-- 侧边栏 -->
  <rect x="12" y="12" width="176" height="376" rx="12" class="chrome"/>
  <text x="30" y="42" class="txt head">Herdr</text>
  <text x="30" y="72" class="txt dim">空间</text>
  <rect x="24" y="80" width="152" height="26" rx="8" fill="#202225"/>
  <rect x="30" y="85" width="16" height="16" rx="5" fill="#22a99a"/>
  <text x="36" y="97" class="txt mid" fill="#ffffff" font-size="10">工</text>
  <text x="52" y="98" class="txt mid">工作区</text>
  <text x="30" y="132" class="txt dim">代理</text>
  <rect x="24" y="140" width="152" height="24" rx="8" class="card"/>
  <circle cx="36" cy="152" r="5" fill="#e3814f"/>
  <text x="48" y="156" class="txt mid">空闲 2</text>
  <rect x="24" y="170" width="152" height="22" rx="7" class="chrome"/>
  <circle cx="36" cy="181" r="4" fill="#e3814f"/>
  <text x="48" y="185" class="txt mid">工作区 · 修 bug</text>
  <text x="30" y="358" class="txt mid">设置</text>
  <text x="30" y="378" class="txt mid">添加机器</text>
  <!-- 标签栏 -->
  <rect x="196" y="12" width="432" height="30" rx="10" class="chrome"/>
  <rect x="204" y="17" width="86" height="20" rx="7" fill="#202225"/>
  <text x="214" y="31" class="mono" fill="#22a99a">&gt;_</text>
  <text x="240" y="31" class="txt mid">1</text>
  <text x="600" y="31" class="txt mid">文件</text>
  <text x="560" y="31" class="txt dim">改动</text>
  <!-- 终端卡片 -->
  <rect x="196" y="50" width="300" height="322" rx="12" class="card"/>
  <rect x="196" y="50" width="300" height="322" rx="12" class="edge"/>
  <text x="212" y="74" class="mono" fill="#8b8f95">&gt;_ zsh</text>
  <text x="260" y="74" class="txt dim">~/工作区</text>
  <text x="212" y="104" class="txt mid" fill="#22a99a">❯ 还没有打开空间。新建一个（⌘+N）。</text>
  <!-- 面板 -->
  <rect x="504" y="50" width="124" height="322" rx="12" class="chrome"/>
  <text x="520" y="74" class="txt head">文件</text>
  <text x="520" y="100" class="txt mid">▾ 源码</text>
  <text x="534" y="122" class="txt dim">index.js</text>
  <text x="534" y="144" class="txt dim">README.md</text>
  <text x="520" y="166" class="txt mid">▸ 测试</text>
  <!-- 状态栏 -->
  <rect x="196" y="378" width="432" height="18" rx="6" class="chrome"/>
  <text x="210" y="391" class="txt dim">本机 · 0 个代理</text>
  <text x="536" y="391" class="txt key">⌘ Shift P  命令</text>
</svg>
